# Friendly page while the node process restarts during a deploy.
#
# Included at the server{} level (deploy/setup.sh inserts the include). A raw
# 502 is what the browser would otherwise show for a navigation request; API
# and WebSocket clients still receive a retryable 503 and reconnect on their
# own.
proxy_intercept_errors on;
error_page 502 503 504 =503 /__maintenance.html;

location = /__maintenance.html {
    internal;
    alias __APP_DIR__/deploy/maintenance.html;
    add_header Retry-After 5 always;
    add_header Cache-Control "no-store" always;
}
