# 准奏 反向代理（由 deploy/setup.sh 首次写入）
#
# 注意：首次部署后 certbot 会改写本文件以启用 443 + 跳转，
# 因此 setup.sh 在文件已存在时不会覆盖它，但会补齐 WebSocket 头。

map $http_upgrade $zhunzou_connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__;

    client_max_body_size 4m;

    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # 长轮询单次最长 55s，代理读超时必须大于它；WebSocket 需要 Upgrade 头
    location / {
        proxy_pass http://127.0.0.1:__PORT__;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $zhunzou_connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }
}
