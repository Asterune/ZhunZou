<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#fff8f5" />
    <meta name="robots" content="noindex" />
    <title>准奏 · Offline</title>
    <style>
      :root {
        color-scheme: light;
        --brand: #93000b;
        --surface: #fff8f5;
        --on-surface: #1f1b1a;
        --on-surface-variant: #6b5e5b;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: var(--surface);
        color: var(--on-surface);
        font-family:
          'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
          'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
        text-align: center;
      }
      main {
        max-width: 380px;
      }
      .seal {
        width: 72px;
        height: 72px;
        margin: 0 auto 20px;
        border-radius: 18px;
        background: var(--brand);
        color: var(--surface);
        font-family: 'Songti SC', 'Noto Serif SC', serif;
        font-size: 40px;
        font-weight: 700;
        line-height: 72px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 20px;
        font-weight: 600;
      }
      p {
        margin: 0 0 20px;
        font-size: 14px;
        line-height: 1.7;
        color: var(--on-surface-variant);
      }
      button {
        border: 0;
        border-radius: 10px;
        padding: 10px 20px;
        background: var(--brand);
        color: var(--surface);
        font-size: 14px;
        font-weight: 600;
        cursor: pointer;
      }
      button:active {
        opacity: 0.85;
      }
    </style>
  </head>
  <body>
    <main>
      <div class="seal">准</div>
      <h1>当前离线 · You are offline</h1>
      <p>
        准奏需要连接 Hub 才能读取奏折和任务。网络恢复后点下方按钮重试。
        <br />
        Zhunzou needs the hub to load tickets and tasks. Retry once you are back
        online.
      </p>
      <button type="button" onclick="location.reload()">重新连接 · Retry</button>
    </main>
    <script>
      window.addEventListener('online', () => location.reload());
    </script>
  </body>
</html>
