name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      # Typecheck reads @zhunzou/shared's emitted d.ts, which is not checked in.
      - run: pnpm --filter @zhunzou/shared build
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
